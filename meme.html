<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monday Mood 😂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    font-family:Arial, sans-serif;
}

.container{
    text-align:center;
}

h1{
    color:white;
    margin-bottom:20px;
    font-size:45px;
    letter-spacing:2px;
}

.meme{
    position:relative;
    width:650px;
    overflow:hidden;
    border-radius:20px;
    transition:.4s;
}


.meme img{
    width:100%;
    display:block;
}

.top,
.bottom{
    position:absolute;
    width:100%;
    color:white;
    font-family:Impact,sans-serif;
    font-size:42px;
    text-transform:uppercase;
    text-align:center;
    padding:10px;

}

.top{
    top:15px;
}

.bottom{
    bottom:15px;
}

footer{
    margin-top:20px;
    color:white;
    font-size:18px;
    opacity:.8;
}

</style>

</head>
<body>

<div class="container">

    <h1>😂 Monday Mood 😂</h1>

    <div class="meme">

        <img src="meme.jpg" alt="Monday Meme">

        <div class="top">
            Sunday 11:59 PM
        </div>

        <div class="bottom">
            When you remember tomorrow is Monday 😭
        </div>

    </div>

    <footer>
        Every weekend ends with this feeling...
    </footer>

</div>

</body>
</html>
